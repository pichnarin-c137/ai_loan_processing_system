name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs; the comment shows the release.
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The auth tests need Postgres; same credentials and host port as infra/compose.yml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: loan_desk
          POSTGRES_PASSWORD: loan_desk
          POSTGRES_DB: loan_desk
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U loan_desk -d loan_desk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install safe-chain (blocks known-malicious packages)
        run: npm install --global @aikidosec/safe-chain@1.5.27 && safe-chain setup-ci
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm spell
      - name: API types match openapi.json (run `pnpm gen:api` if this fails)
        run: pnpm --filter frontend gen:api && git diff --exit-code -- frontend/src/lib/api/schema.d.ts
      - run: pnpm --filter frontend exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm e2e

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The database tests need Postgres; same credentials and host port as infra/compose.yml.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: loan_desk
          POSTGRES_PASSWORD: loan_desk
          POSTGRES_DB: loan_desk
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U loan_desk -d loan_desk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 0.13.6
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # After setup-uv, so safe-chain finds uv and wraps it.
      - name: Install safe-chain (blocks known-malicious packages)
        run: npm install --global @aikidosec/safe-chain@1.5.27 && safe-chain setup-ci
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy app tests scripts
      - name: openapi.json matches the API (run `pnpm gen:api` if this fails)
        run: uv run python scripts/dump_openapi.py && git diff --exit-code -- ../frontend/src/lib/api/openapi.json
      - run: uv run pytest
