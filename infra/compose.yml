# Local development stack: `docker compose -f infra/compose.yml up --build`
# The credentials below are for local use only. Production values come from the server's .env.
name: loan-desk

# The auth service and its migration step. BETTER_AUTH_SECRET falls back to a local-only value
# (auth/src/env.ts); production sets a real one in .env.
x-auth: &auth
  build:
    context: ..
    dockerfile: auth/Dockerfile
  env_file:
    - path: ../.env
      required: false
  environment:
    NODE_ENV: development
    AUTH_DATABASE_URL: postgres://loan_desk_auth:loan_desk_auth@postgres:5432/loan_desk
    # The site's public origin (the Vite dev server); also the JWT issuer.
    BETTER_AUTH_URL: http://localhost:5173
    AUTH_JWT_AUDIENCE: loan-desk-api
  volumes:
    - ../auth/src:/repo/auth/src:ro,z

x-backend: &backend
  build: ../backend
  env_file:
    - path: ../.env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://loan_desk_app:loan_desk_app@postgres:5432/loan_desk
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://storage:8333
    S3_ACCESS_KEY: loan-desk
    S3_SECRET_KEY: loan-desk-secret
    S3_BUCKET: loan-desk-documents
    # FastAPI checks the JWTs the auth service issues against its public keys.
    AUTH_JWKS_URL: http://auth:3001/api/auth/jwks
    AUTH_ISSUER: http://localhost:5173
    AUTH_AUDIENCE: loan-desk-api
  volumes:
    - ../backend/app:/app/app:ro,z
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: loan_desk
      POSTGRES_PASSWORD: loan_desk
      POSTGRES_DB: loan_desk
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro,z
    ports:
      - 127.0.0.1:5433:5432
    # Over TCP: on first start the init scripts run on a socket-only server that pg_isready
    # would already report as ready.
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, loan_desk, -d, loan_desk]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (stands in for Cloudflare R2).
  storage:
    image: chrislusf/seaweedfs:4.50
    command: [mini, -dir=/data, -bucket=loan-desk-documents, -master.telemetry=false]
    environment:
      AWS_ACCESS_KEY_ID: loan-desk
      AWS_SECRET_ACCESS_KEY: loan-desk-secret
    volumes:
      - storage-data:/data
    ports:
      - 127.0.0.1:8333:8333
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8333/healthz]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations as the owner role, then exits. api and worker wait for it.
  # Only this service gets MIGRATION_DATABASE_URL; keep it out of the shared .env.
  migrate:
    build: ../backend
    command: [alembic, upgrade, head]
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://loan_desk:loan_desk@postgres:5432/loan_desk
    volumes:
      - ../backend/app:/app/app:ro,z
      - ../backend/migrations:/app/migrations:ro,z
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --reload, --reload-dir, app]
    ports:
      - 127.0.0.1:8000:8000

  worker:
    <<: *backend
    command: [dramatiq, app.worker.tasks, --processes, '1', --threads, '2']

  # One-shot: creates or updates Better Auth's tables in the auth schema, then exits.
  auth-migrate:
    <<: *auth
    command: [node, src/migrate.ts]
    depends_on:
      postgres:
        condition: service_healthy

  auth:
    <<: *auth
    command: [node, --watch, src/index.ts]
    ports:
      - 127.0.0.1:3001:3001
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  # Vite dev server, using the node_modules installed on the host by `pnpm install`.
  web:
    image: node:26-slim
    user: ${UID:-1000}:${GID:-1000}
    working_dir: /repo/frontend
    command: [node_modules/.bin/vite, dev, --host, 0.0.0.0]
    environment:
      AUTH_URL: http://auth:3001
      API_URL: http://api:8000
    volumes:
      - ..:/repo:z
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      - api
      - auth

volumes:
  postgres-data:
  redis-data:
  storage-data:
