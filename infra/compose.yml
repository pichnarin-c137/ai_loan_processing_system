# Local development stack: `docker compose -f infra/compose.yml up --build`
# The credentials below are for local use only. Production values come from the server's .env.
name: loan-desk

x-backend: &backend
  build: ../backend
  env_file:
    - path: ../.env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://loan_desk:loan_desk@postgres:5432/loan_desk
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://storage:8333
    S3_ACCESS_KEY: loan-desk
    S3_SECRET_KEY: loan-desk-secret
    S3_BUCKET: loan-desk-documents
  volumes:
    - ../backend/app:/app/app:ro,z
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage:
      condition: service_healthy

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: loan_desk
      POSTGRES_PASSWORD: loan_desk
      POSTGRES_DB: loan_desk
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - 127.0.0.1:5433:5432
    healthcheck:
      test: [CMD, pg_isready, -U, loan_desk, -d, loan_desk]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (stands in for Cloudflare R2).
  storage:
    image: chrislusf/seaweedfs:4.50
    command: [mini, -dir=/data, -bucket=loan-desk-documents, -master.telemetry=false]
    environment:
      AWS_ACCESS_KEY_ID: loan-desk
      AWS_SECRET_ACCESS_KEY: loan-desk-secret
    volumes:
      - storage-data:/data
    ports:
      - 127.0.0.1:8333:8333
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8333/healthz]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --reload, --reload-dir, app]
    ports:
      - 127.0.0.1:8000:8000

  worker:
    <<: *backend
    command: [dramatiq, app.worker.tasks, --processes, '1', --threads, '2']

  auth:
    build:
      context: ..
      dockerfile: auth/Dockerfile
    command: [node, --watch, src/index.ts]
    env_file:
      - path: ../.env
        required: false
    environment:
      NODE_ENV: development
    volumes:
      - ../auth/src:/repo/auth/src:ro,z
    ports:
      - 127.0.0.1:3001:3001

  # Vite dev server, using the node_modules installed on the host by `pnpm install`.
  web:
    image: node:26-slim
    user: ${UID:-1000}:${GID:-1000}
    working_dir: /repo/frontend
    command: [node_modules/.bin/vite, dev, --host, 0.0.0.0]
    environment:
      AUTH_URL: http://auth:3001
      API_URL: http://api:8000
    volumes:
      - ..:/repo:z
    ports:
      - 127.0.0.1:5173:5173
    depends_on:
      - api
      - auth

volumes:
  postgres-data:
  redis-data:
  storage-data:
